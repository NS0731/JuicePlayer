<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JuicePlayer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="layout">
    <section class="panel">
      <h2>Search</h2>
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Search songs" />
      </div>
      <div class="search-row">
        <button id="searchBtn" type="button">Search</button>
      </div>
      <div id="categoryButtons" class="category-buttons"></div>
      <div id="loading">Loading songs...</div>
      <div id="empty">No results found.</div>
      <div id="status"></div>
      <div id="results" class="list"></div>
      <button id="loadMoreBtn" type="button">Load More</button>
    </section>

    <section class="panel">
      <h2>Queue</h2>
      <div id="queue" class="list"></div>
    </section>
  </div>

  <div class="player-bar">
    <div class="controls">
      <button id="prevBtn" type="button">Previous</button>
      <button id="playPauseBtn" type="button">Play</button>
      <button id="nextBtn" type="button">Next</button>
      <button id="radioBtn" type="button">Radio Off</button>
    </div>
    <div class="progress-wrap">
      <span id="currentTime" class="time">0:00</span>
      <input id="progressBar" type="range" min="0" max="100" value="0" step="0.1" />
      <span id="duration" class="time">0:00</span>
    </div>
    <div id="nowPlaying">Now Playing: Nothing</div>
    <audio id="player"></audio>
  </div>

  <script src="./app.js"></script>
</body>
</html>
